# SPEC §14.7：lint + typecheck + test + build，PR 必过。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # §14.7 覆盖率门槛：src/shared/ ≥90%，不达标直接失败
      - name: Coverage
        run: npm run test:cov

      - name: Build
        run: npm run package
